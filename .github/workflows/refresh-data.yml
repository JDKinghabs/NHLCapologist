name: Refresh cap data

# Re-scrapes Spotrac (each team's current cap page and multi-year page), refreshes
# standings from the NHL API, validates the result, and commits
# data/nhl-cap-data.json when it actually changed (days with no changes produce
# no commit). The commit (pushed to main) triggers the Cloudflare Pages redeploy.
#
# Failures: if some teams or the NHL API fail, whatever succeeded is still
# committed and the run is then marked failed, so GitHub emails the owner. If
# the data fails validation, nothing is committed.

on:
  schedule:
    # Daily at 09:00 UTC. Cron is UTC; adjust if you want a different local time.
    - cron: "0 9 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      debug_team:
        description: "Print this team's Spotrac table markup to the log (e.g. NYI)"
        required: false
        default: ""
      debug_player:
        description: "Also print table rows containing this player name"
        required: false
        default: ""
      debug_url:
        description: "Only fetch and print these Spotrac URLs (comma-separated); no refresh"
        required: false
        default: ""
      dry_run:
        description: "Scrape and log, but don't write or commit the data"
        type: boolean
        required: false
        default: false

# Avoid overlapping refresh runs racing on the same file.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write # needed to push the refreshed JSON

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Refresh data from Spotrac
        id: cap
        run: node scripts/refresh-data.js
        # Exit 2 means some pages failed but the rest were written; commit those first.
        continue-on-error: true
        env:
          SPOTRAC_DEBUG: ${{ inputs.debug_team }}
          SPOTRAC_DEBUG_PLAYER: ${{ inputs.debug_player }}
          REFRESH_DRY_RUN: ${{ inputs.dry_run }}
          SPOTRAC_DEBUG_URL: ${{ inputs.debug_url }}

      - name: Refresh standings from the NHL API
        id: standings
        run: node scripts/refresh-standings.mjs
        # Cap data still gets committed if the NHL API is down.
        continue-on-error: true
        env:
          REFRESH_DRY_RUN: ${{ inputs.dry_run }}

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain data/nhl-cap-data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/nhl-cap-data.json
            git commit -m "chore(data): refresh cap data ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed cap data."
          else
            echo "No data changes — nothing to commit."
          fi

      - name: Fail the run if a refresh step failed
        if: steps.cap.outcome == 'failure' || steps.standings.outcome == 'failure'
        run: |
          echo "::error::Refresh incomplete (Spotrac: ${{ steps.cap.outcome }}, NHL standings: ${{ steps.standings.outcome }}). Whatever succeeded was committed; the step logs list what failed."
          exit 1
